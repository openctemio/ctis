name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Verify zero external dependencies
        run: |
          DEPS=$(go list -m all 2>/dev/null | grep -v "github.com/openctemio/ctis" | wc -l)
          if [ "$DEPS" -gt 0 ]; then
            echo "ERROR: ctis module must have zero external dependencies"
            go list -m all
            exit 1
          fi

      - name: Build all platforms
        run: |
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              echo "Building $GOOS/$GOARCH..."
              GOOS=$GOOS GOARCH=$GOARCH go build ./...
            done
          done

      - name: Run tests
        run: go test -v -race ./...

      - name: Validate schemas and examples
        run: |
          pip install "jsonschema[format-nongpl]==4.25.1"
          python3 scripts/validate_schemas.py

      # The tag must be vMAJOR.MINOR.PATCH, its major must match the module
      # path (v1 has no /vN suffix, v2+ needs /vN), its MAJOR.MINOR must be
      # the CTIS spec version the code stamps (ctis.SchemaVersion), and
      # CHANGELOG.md must have a section for it.
      - name: Verify tag against module, spec version and changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; VERSION="${TAG#v}"
          MODULE="$(go list -m)"
          if [ "$MAJOR" -ge 2 ]; then WANT="github.com/openctemio/ctis/v$MAJOR"; else WANT="github.com/openctemio/ctis"; fi
          if [ "$MODULE" != "$WANT" ]; then
            echo "ERROR: tag $TAG needs module path $WANT, go.mod has $MODULE"; exit 1
          fi
          SPEC="$(sed -nE 's/^[[:space:]]*SchemaVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' version.go)"
          if [ "$SPEC" != "$MAJOR.$MINOR" ]; then
            echo "ERROR: tag $TAG but ctis.SchemaVersion is $SPEC (want $MAJOR.$MINOR)"; exit 1
          fi
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no '## [$VERSION]' section"; exit 1
          fi
          echo "Tag $TAG matches $MODULE, CTIS $SPEC and CHANGELOG.md"

  release:
    name: Create release
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > section.md
          {
            echo "changes<<CHANGELOG_EOF"
            cat section.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          body: |
            ${{ steps.changelog.outputs.changes }}

            ## Installation
            ```bash
            go get github.com/openctemio/ctis@${{ github.ref_name }}
            ```

            ## Compatibility
            - CTIS spec version: see CHANGELOG.md; receivers accept any 1.x report (docs/spec.md, Versioning)
            - Go 1.22+
            - Zero external dependencies
            - Apache-2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize release notes
        # Generated notes copy PR titles and commit authors verbatim, so
        # "@latest" or "@types/node" becomes a GitHub mention that pulls an
        # unrelated account into the release's Contributors, and author emails
        # get published. Escape every mention that is not a "by @login" credit
        # and drop raw email addresses.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 - notes.md <<'PY'
          import re, sys
          path = sys.argv[1]
          text = re.sub(r" ?<[^<>\s]+@[^<>\s]+>", "", open(path).read())
          mention = re.compile(r"(?<![\w`/.@-])(?<!by )(?<!\* )@[A-Za-z0-9][\w-]*(?:/[\w.-]+)?(?:@[\w.^~-]+)?")
          parts = re.split(r"(`[^`]*`)", text)
          text = "".join(p if p.startswith("`") else mention.sub(lambda m: "`" + m.group(0) + "`", p) for p in parts)
          open(path, "w").write(text)
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
