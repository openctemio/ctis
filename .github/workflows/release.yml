name: Release

on:
  push:
    tags:
      # The core module: vMAJOR.MINOR.PATCH.
      - 'v*'
      # An interoperability adapter: v2/interop/<format>/vX.Y.Z (its own module,
      # released on its own when its upstream format changes).
      - 'v2/interop/*/v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/v2/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Verify zero external dependencies
        run: |
          DEPS=$(go list -m all 2>/dev/null | grep -v "github.com/openctemio/ctis" | wc -l)
          if [ "$DEPS" -gt 0 ]; then
            echo "ERROR: ctis module must have zero external dependencies"
            go list -m all
            exit 1
          fi

      - name: Build all platforms
        run: |
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              echo "Building $GOOS/$GOARCH..."
              GOOS=$GOOS GOARCH=$GOARCH go build ./...
            done
          done

      - name: Run tests
        run: go test -v -race ./...

      - name: Validate schemas and examples
        run: |
          pip install "jsonschema[format-nongpl]==4.25.1"
          python3 scripts/validate_schemas.py

      # The tag must be vMAJOR.MINOR.PATCH, its major must match the module
      # path (v1 has no /vN suffix, v2+ needs /vN), its MAJOR.MINOR must be
      # the CTIS spec version the code stamps (ctis.SchemaVersion), and
      # CHANGELOG.md must have a section for it.
      - name: Verify tag against module, spec version and changelog
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: tag $TAG is not vMAJOR.MINOR.PATCH"; exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; VERSION="${TAG#v}"
          MODULE="$(go list -m)"
          if [ "$MAJOR" -ge 2 ]; then WANT="github.com/openctemio/ctis/v$MAJOR"; else WANT="github.com/openctemio/ctis"; fi
          if [ "$MODULE" != "$WANT" ]; then
            echo "ERROR: tag $TAG needs module path $WANT, go.mod has $MODULE"; exit 1
          fi
          SPEC="$(sed -nE 's/^[[:space:]]*SchemaVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' version.go)"
          if [ "$SPEC" != "$MAJOR.$MINOR" ]; then
            echo "ERROR: tag $TAG but ctis.SchemaVersion is $SPEC (want $MAJOR.$MINOR)"; exit 1
          fi
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no '## [$VERSION]' section"; exit 1
          fi
          echo "Tag $TAG matches $MODULE, CTIS $SPEC and CHANGELOG.md"

  release:
    name: Create release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/v2/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      # One static binary per platform, built reproducibly (-trimpath, no
      # debug info) with the tag stamped in, plus SHA256SUMS over all of them.
      - name: Build ctis binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
              OUT="dist/ctis_${TAG}_${GOOS}_${GOARCH}${EXT}"
              echo "Building $OUT"
              (cd v2/cmd/ctis && CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
                go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "../../$OUT" .)
            done
          done
          (cd dist && sha256sum ctis_* > SHA256SUMS && cat SHA256SUMS)

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > section.md
          {
            echo "changes<<CHANGELOG_EOF"
            cat section.md
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/ctis_*
            dist/SHA256SUMS
          body: |
            ${{ steps.changelog.outputs.changes }}

            ## Installation
            ```bash
            go get github.com/openctemio/ctis@${{ github.ref_name }}
            ```

            The `ctis` command line tool (`ctis validate`) is attached for linux, darwin and windows on amd64 and arm64. Check a download with `sha256sum -c SHA256SUMS`.

            ## Compatibility
            - CTIS spec version: see CHANGELOG.md; receivers accept any 1.x report (docs/spec.md, Versioning)
            - Go 1.22+
            - Zero external dependencies
            - Apache-2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize release notes
        # Generated notes copy PR titles and commit authors verbatim, so
        # "@latest" or "@types/node" becomes a GitHub mention that pulls an
        # unrelated account into the release's Contributors, and author emails
        # get published. Escape every mention that is not a "by @login" credit
        # and drop raw email addresses.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          python3 - notes.md <<'PY'
          import re, sys
          path = sys.argv[1]
          text = re.sub(r" ?<[^<>\s]+@[^<>\s]+>", "", open(path).read())
          mention = re.compile(r"(?<![\w`/.@-])(?<!by )(?<!\* )@[A-Za-z0-9][\w-]*(?:/[\w.-]+)?(?:@[\w.^~-]+)?")
          parts = re.split(r"(`[^`]*`)", text)
          text = "".join(p if p.startswith("`") else mention.sub(lambda m: "`" + m.group(0) + "`", p) for p in parts)
          open(path, "w").write(text)
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  # An adapter tag validates and releases that module only: its path, its
  # changelog, zero external dependencies, the build on every platform, its
  # tests (golden files, round trips, conformance/interop vectors).
  validate-adapter:
    name: Validate adapter release
    if: startsWith(github.ref, 'refs/tags/v2/interop/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Verify tag against module and changelog
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^v2/interop/([a-z][a-z0-9-]*)/v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "ERROR: tag $TAG is not v2/interop/<format>/vMAJOR.MINOR.PATCH"; exit 1
          fi
          FORMAT="${BASH_REMATCH[1]}"; MAJOR="${BASH_REMATCH[2]}"; VERSION="${TAG##*/v}"
          DIR="v2/interop/$FORMAT"
          WANT="github.com/openctemio/ctis/v2/interop/$FORMAT"
          if [ "$MAJOR" -ge 2 ]; then WANT="$WANT/v$MAJOR"; fi
          MODULE="$(cd "$DIR" && go list -m)"
          if [ "$MODULE" != "$WANT" ]; then
            echo "ERROR: tag $TAG needs module path $WANT, $DIR/go.mod has $MODULE"; exit 1
          fi
          if ! grep -qE "^## \[$VERSION\]" "$DIR/CHANGELOG.md"; then
            echo "ERROR: $DIR/CHANGELOG.md has no '## [$VERSION]' section"; exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify zero external dependencies
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          DEPS=$(go list -m all 2>/dev/null | grep -v "^github.com/openctemio/ctis/v2" | wc -l)
          if [ "$DEPS" -gt 0 ]; then
            echo "ERROR: the adapter must depend on the core module only"
            go list -m all
            exit 1
          fi

      - name: Build all platforms and test
        working-directory: ${{ steps.tag.outputs.dir }}
        run: |
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              GOOS=$GOOS GOARCH=$GOARCH go build ./...
            done
          done
          go test -race ./...

  release-adapter:
    name: Create adapter release
    needs: validate-adapter
    if: startsWith(github.ref, 'refs/tags/v2/interop/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create release from the adapter changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          DIR="$(dirname "$TAG")"; VERSION="${TAG##*/v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' "$DIR/CHANGELOG.md" > notes.md
          printf '\n## Installation\n```bash\ngo get github.com/openctemio/ctis/v2/%s@v%s\n```\n' "$DIR" "$VERSION" >> notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md
