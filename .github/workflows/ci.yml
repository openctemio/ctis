name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Upgrade together with .golangci.yml.
  GOLANGCI_LINT_VERSION: v2.14.0
  # Floor for total statement coverage (all packages). Raise it when coverage
  # rises; never lower it to make a PR pass.
  COVERAGE_MIN: 85

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23', '1.26', '1.27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # Every module (the core, each interoperability adapter, the command)
      # depends on nothing outside this repository: stdlib only.
      - name: Verify zero external dependencies
        run: |
          for m in $(bash .github/scripts/modules.sh); do
            DEPS=$(cd "$m" && go list -m all 2>/dev/null | grep -v "^github.com/openctemio/ctis/v2" | wc -l)
            if [ "$DEPS" -gt 0 ]; then
              echo "ERROR: module $m must have zero external dependencies"
              (cd "$m" && go list -m all)
              exit 1
            fi
          done
          echo "Zero external dependencies confirmed in every module"

      - name: Build
        run: |
          for m in $(bash .github/scripts/modules.sh); do (cd "$m" && go build ./...) || exit 1; done

      # Includes the schema <-> Go parity tests, the examples, the converter
      # outputs validated against schemas/v2, and per adapter its golden
      # files, round trips and the conformance/interop vectors.
      - name: Run tests
        run: |
          for m in $(bash .github/scripts/modules.sh); do
            out="$GITHUB_WORKSPACE/coverage-$(echo "$m" | tr '/.' '__').out"
            (cd "$m" && go test -race -coverprofile="$out" ./...) || exit 1
          done

      # The floor applies to every module on its own.
      - name: Check coverage
        if: matrix.go-version == '1.27'
        run: |
          fail=0
          for m in $(bash .github/scripts/modules.sh); do
            f="$GITHUB_WORKSPACE/coverage-$(echo "$m" | tr '/.' '__').out"
            COVERAGE=$(cd "$m" && go tool cover -func="$f" | awk '/^total:/ {sub("%", "", $3); print $3}')
            echo "$f: ${COVERAGE}% (minimum ${COVERAGE_MIN}%)"
            awk -v c="$COVERAGE" -v m="$COVERAGE_MIN" 'BEGIN { exit (c + 0 >= m + 0) ? 0 : 1 }' || {
              echo "ERROR: $f coverage ${COVERAGE}% is below ${COVERAGE_MIN}%"
              fail=1
            }
          done
          exit $fail

      - name: Upload coverage
        if: matrix.go-version == '1.27'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage-*.out
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actions are pinned to commit SHAs
        run: bash .github/scripts/check-action-pins.sh

      - name: go directives are minimal and not newer than the consumers' Go
        run: bash .github/scripts/check-go-directive.sh

      - name: Customer identifiers (self-test)
        run: bash .github/scripts/check-customer-identifiers.test.sh >/dev/null

      - name: DCO checker (self-test)
        run: bash .github/scripts/dco-check.test.sh >/dev/null

      # Fails when a tracked file names a customer (case-insensitive fixed
      # strings from the CUSTOMER_DENYLIST secret, so the list is never
      # committed) or carries the live LAN range outside tests. Prints only
      # file:line. Passes with a notice when the secret is empty (forks).
      - name: Customer identifiers
        env:
          CUSTOMER_DENYLIST: ${{ secrets.CUSTOMER_DENYLIST }}
        run: bash .github/scripts/check-customer-identifiers.sh


      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Run go vet
        run: |
          for m in $(bash .github/scripts/modules.sh); do (cd "$m" && go vet ./...) || exit 1; done

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      # Every module, with the root configuration.
      - name: Run golangci-lint
        run: |
          for m in $(bash .github/scripts/modules.sh); do
            echo "::group::golangci-lint $m"
            (cd "$m" && golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" ./...) || exit 1
            echo "::endgroup::"
          done

  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Meta-validates every schema (2020-12), resolves every $ref through
      # the $id registry, validates examples/ and the converter golden files
      # with format checks, and requires examples/invalid/ to be rejected.
      - name: Validate schemas and examples
        run: |
          pip install "jsonschema[format-nongpl]==4.25.1"
          python3 scripts/validate_schemas.py

      # The vendored upstream schemas match the sha256 of
      # interop/upstreams.json, and the upstream samples of
      # conformance/interop validate against them (offline).
      - name: Interop schemas and vectors
        run: python3 scripts/check_interop_schemas.py --validate

  cli:
    name: ctis CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      # v2/cmd/ctis is its own module (it links the adapters).
      - name: Build the CLI
        working-directory: v2/cmd/ctis
        run: go build -trimpath -o "$RUNNER_TEMP/ctis" .

      - name: Valid examples validate
        run: '"$RUNNER_TEMP/ctis" validate examples/*.json'

      - name: Invalid examples are refused
        run: |
          for f in examples/invalid/*.json; do
            if "$RUNNER_TEMP/ctis" validate "$f" >/dev/null; then
              echo "ERROR: $f was accepted"; exit 1
            fi
          done
          echo "all invalid examples refused"

      - name: Conformance vectors
        run: '"$RUNNER_TEMP/ctis" conformance conformance/v2'

      - name: Import and export through the adapters
        run: |
          "$RUNNER_TEMP/ctis" import v2/interop/sarif/testdata/importers/semgrep.sarif > "$RUNNER_TEMP/r.ctis.json"
          "$RUNNER_TEMP/ctis" validate "$RUNNER_TEMP/r.ctis.json"
          for f in sarif cyclonedx ocsf; do
            "$RUNNER_TEMP/ctis" export --format "$f" "$RUNNER_TEMP/r.ctis.json" > /dev/null
          done

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Fuzz each target briefly
        run: |
          # A short minimization keeps a new input from running past the
          # time budget (the run then fails with "context deadline exceeded").
          for target in FuzzValidate FuzzConvertRecon FuzzParseVersion FuzzHTTPExchangeFromRaw FuzzParseHTTPXLine FuzzDecode FuzzCanonical; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s -fuzzminimizetime 1x .
          done
          # The importers read hostile files; a short minimization keeps the
          # time budget on new inputs.
          for target in FuzzParse FuzzDetect FuzzParseBundle; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s -fuzzminimizetime 1x ./importer
          done
          # Declarative mappings: hostile tool output and hostile mapping files.
          for target in FuzzApply FuzzLoad; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s -fuzzminimizetime 1x ./importer/mapping
          done
          # Web URLs: hostile URLs from crawlers, specs and scanners.
          go test -run '^$' -fuzz '^FuzzWebURL$' -fuzztime 20s -fuzzminimizetime 1x ./weburl
          # Interop engine: hostile documents through the passthrough and
          # the write-back.
          go test -run '^$' -fuzz '^FuzzCollect$' -fuzztime 20s -fuzzminimizetime 1x ./interop/engine
          # The SARIF adapter reads hostile logs.
          (cd v2/interop/sarif && go test -run '^$' -fuzz '^FuzzFromSARIF$' -fuzztime 20s -fuzzminimizetime 1x .)

  build-compat:
    name: Cross-platform build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache: true

      - name: Build
        run: |
          for m in $(bash .github/scripts/modules.sh); do (cd "$m" && go build ./...) || exit 1; done
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
