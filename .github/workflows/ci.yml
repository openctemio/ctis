name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Upgrade together with .golangci.yml.
  GOLANGCI_LINT_VERSION: v2.14.0
  # Floor for total statement coverage (all packages). Raise it when coverage
  # rises; never lower it to make a PR pass.
  COVERAGE_MIN: 85

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23', '1.26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify zero external dependencies
        run: |
          DEPS=$(go list -m all 2>/dev/null | grep -v "github.com/openctemio/ctis" | wc -l)
          if [ "$DEPS" -gt 0 ]; then
            echo "ERROR: ctis module must have zero external dependencies"
            go list -m all
            exit 1
          fi
          echo "Zero external dependencies confirmed"

      - name: Build
        run: go build -v ./...

      # Includes the schema <-> Go parity tests, the examples and the
      # converter outputs validated against schemas/v1.
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage
        if: matrix.go-version == '1.26'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "Total coverage: ${COVERAGE}% (minimum ${COVERAGE_MIN}%)"
          awk -v c="$COVERAGE" -v m="$COVERAGE_MIN" 'BEGIN { exit (c + 0 >= m + 0) ? 0 : 1 }' || {
            echo "ERROR: coverage ${COVERAGE}% is below ${COVERAGE_MIN}%"
            exit 1
          }

      - name: Upload coverage
        if: matrix.go-version == '1.26'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.out
        continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Actions are pinned to commit SHAs
        run: bash .github/scripts/check-action-pins.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Files not formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Meta-validates every schema (draft-07), resolves every $ref through
      # the $id registry, validates examples/ and the converter golden files
      # with format checks, and requires examples/invalid/ to be rejected.
      - name: Validate schemas and examples
        run: |
          pip install "jsonschema[format-nongpl]==4.25.1"
          python3 scripts/validate_schemas.py

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Fuzz each target briefly
        run: |
          for target in FuzzValidate FuzzFromSARIF FuzzConvertRecon FuzzParseVersion; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s .
          done
          # The importers read hostile files; a short minimization keeps the
          # time budget on new inputs.
          for target in FuzzParse FuzzDetect; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s -fuzzminimizetime 1x ./importer
          done
          # Declarative mappings: hostile tool output and hostile mapping files.
          for target in FuzzApply FuzzLoad; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 20s -fuzzminimizetime 1x ./importer/mapping
          done

  build-compat:
    name: Cross-platform build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build -v ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
