# Betterleaks configuration (gitleaks-compatible format).
# The default rules apply everywhere except the throwaway fixtures listed here.
# A verified false positive outside these paths goes in .gitleaksignore as
# commit:file:rule:line, with a comment saying why it is not a credential.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and lock files"
paths = [
    '''(^|/)testdata/''',
    '''_test\.go$''',
    '''(^|/)__tests__/''',
    # Conformance vectors: expected hashes and HMAC digests of throwaway strings; not credentials.
    '''(^|/)conformance/v2/(fingerprint|correlation)/[^/]+\.json$''',
    '''\.test\.[jt]sx?$''',
    # Vendored upstream schemas: unmodified official files, sha256-pinned in interop/upstreams.json.
    # Optional v2/: the full-history scan on main still sees them at their first path (interop/).
    '''^(v2/)?interop/[a-z]+/schemas/''',
    '''(^|/)(go\.sum|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$''',
]
# Obvious placeholders in docs and examples (matched against the secret only).
regexes = [
    '''(?i)^(your[-_ ]|<|\$\{|\$\(|example|changeme|placeholder|x{4,})''',
    # The word itself, as the name of a form field type hint (TypeHintPassword).
    '''^password$''',
]
